<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ohgrow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=28">
  <link rel="stylesheet" href="css/components.css?v=28">
  <link rel="stylesheet" href="css/layout.css?v=28">
  <link rel="stylesheet" href="css/home.css?v=28">
</head>
<body data-page="home">
  <div class="wrap">
    <div data-include="components/header.html?v=28"></div>

    <div class="content">
      <div data-include="components/side-rail.html?v=28"></div>

      <main>
        <section id="home">
          <div class="hero">
            <div class="hero-copy">
              <h1><span class="line"><span>Where harvests</span></span><span class="line"><span class="outline">find buyers</span></span></h1>
              <p>Ohgrow is where farmers upload their produce, set a price and sell straight to buyers nearby.</p>
              <div class="hero-btns">
                <a class="btn btn-dark" href="sell.html"><span>Start selling</span><span class="ico"><svg class="i"><use href="assets/icons/sprite.svg?v=28#arrow"/></svg></span></a>
                <a class="btn btn-ghost" href="market.html"><span>Browse market</span></a>
              </div>
            </div>

            <div class="hero-art">
              <img class="hero-img" src="assets/images/hero-image.png" alt="Fresh harvest">
              <div class="hero-fade" aria-hidden="true"></div>
              <div class="float" aria-label="Fresh tomatoes, ₦38,000">
                <span class="mini"><img src="assets/images/product-image.png" alt="" onerror="this.parentNode.classList.add('no-img');this.remove()"></span>
                <span class="tag">₦38,000</span>
              </div>
            </div>
          </div>

          <div class="trio">

            <div class="stats">
              <div class="stat"><svg class="i"><use href="assets/icons/sprite.svg?v=28#users"/></svg><b data-count="120" data-suffix="+">120+</b><span>Farmers onboard</span></div>
              <div class="stat"><svg class="i"><use href="assets/icons/sprite.svg?v=28#basket"/></svg><b data-count="250" data-suffix="+">250+</b><span>Live listings</span></div>
              <div class="stat"><svg class="i"><use href="assets/icons/sprite.svg?v=28#pin"/></svg><b data-count="36">36</b><span>States covered</span></div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div data-include="components/mobile-dock.html?v=28"></div>
  <div data-include="components/mobile-panel.html?v=28"></div>

  <script src="js/main.js?v=28"></script>
  <script src="js/layout.js?v=28"></script>
  <script src="js/home.js?v=28"></script>
</body>
</html>
